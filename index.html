<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Bird Journey - Interactive Narrative</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #FFF8DC 100%);
            height: 100vh;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Intro Screen */
        #intro {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            z-index: 1000;
            transition: opacity 0.8s;
        }

        #intro.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #intro h1 {
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 1rem;
            text-align: center;
        }

        #intro p {
            font-size: 1.2rem;
            color: #555;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 2rem;
            padding: 0 20px;
        }

        #startButton {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        #startButton:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        /* Episode Screens */
        .episode-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 500;
        }

        .episode-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Mountain Episode */
        #mountainEpisode {
            background: linear-gradient(to bottom,
                #FFD700 0%,
                #FFA500 20%,
                #87CEEB 40%,
                #6B8E9F 70%,
                #8B7355 100%);
            overflow: hidden;
        }

        .mountain-scene {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 300%;
            height: 80%;
            animation: scrollLeft 8s linear infinite;
        }

        .mountain-large {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 40vw solid transparent;
            border-right: 40vw solid transparent;
            border-bottom: 70vh solid #8B7355;
        }

        .mountain-large:nth-child(1) {
            left: 10%;
        }

        .mountain-large:nth-child(2) {
            left: 50%;
        }

        .mountain-large:nth-child(3) {
            left: 110%;
        }

        .mountain-snow-large {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20vw solid transparent;
            border-right: 20vw solid transparent;
            border-bottom: 25vh solid #FFFFFF;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
        }

        .sun-rays {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 223, 0, 0.8) 0%, rgba(255, 165, 0, 0.4) 40%, transparent 70%);
            border-radius: 50%;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
            50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
        }

        @keyframes scrollLeft {
            from { transform: translateX(0); }
            to { transform: translateX(-33.333%); }
        }

        /* Ocean Episode */
        #oceanEpisode {
            background: linear-gradient(to bottom,
                #87CEEB 0%,
                #4A90E2 40%,
                #2E5F8F 70%,
                #1E3A5F 100%);
            overflow: hidden;
        }

        .ocean-scene {
            position: absolute;
            width: 300%;
            height: 100%;
            animation: scrollLeft 10s linear infinite;
        }

        .wave-large {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: #3A7BC8;
            border-radius: 50%;
            animation: wave-motion-large 4s ease-in-out infinite;
        }

        .wave-large:nth-child(1) {
            animation-delay: 0s;
            opacity: 0.8;
            left: 0;
        }

        .wave-large:nth-child(2) {
            animation-delay: 1.3s;
            opacity: 0.6;
            height: 130px;
            left: 33.333%;
        }

        .wave-large:nth-child(3) {
            animation-delay: 2.6s;
            opacity: 0.4;
            height: 110px;
            left: 66.666%;
        }

        @keyframes wave-motion-large {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .clouds {
            position: absolute;
            top: 20%;
            width: 300%;
            height: 30%;
            animation: scrollLeftSlow 15s linear infinite;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 100px;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 100px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 20px;
            left: 20%;
        }

        .cloud1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1::after {
            width: 60px;
            height: 40px;
            top: -15px;
            right: 10px;
        }

        .cloud2 {
            width: 120px;
            height: 50px;
            top: 80px;
            left: 60%;
        }

        .cloud2::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 15px;
        }

        .cloud2::after {
            width: 70px;
            height: 50px;
            top: -20px;
            right: 15px;
        }

        .cloud3 {
            width: 110px;
            height: 45px;
            top: 50px;
            left: 140%;
        }

        .cloud3::before {
            width: 55px;
            height: 55px;
            top: -28px;
            left: 12px;
        }

        .cloud3::after {
            width: 65px;
            height: 45px;
            top: -18px;
            right: 12px;
        }

        @keyframes scrollLeftSlow {
            from { transform: translateX(0); }
            to { transform: translateX(-33.333%); }
        }

        /* City Episode */
        #cityEpisode {
            background: linear-gradient(to bottom,
                #1a1a2e 0%,
                #16213e 50%,
                #0f3460 100%);
            overflow: hidden;
        }

        .city-scene {
            position: absolute;
            bottom: 0;
            width: 300%;
            height: 70%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            animation: scrollLeft 12s linear infinite;
        }

        .building-large {
            position: relative;
            background: #34495e;
            margin: 0 10px;
            border-radius: 5px 5px 0 0;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .building-large:nth-child(1) {
            width: 120px;
            height: 350px;
        }

        .building-large:nth-child(2) {
            width: 150px;
            height: 450px;
        }

        .building-large:nth-child(3) {
            width: 100px;
            height: 300px;
        }

        .building-large:nth-child(4) {
            width: 180px;
            height: 500px;
        }

        .building-large:nth-child(5) {
            width: 130px;
            height: 380px;
        }

        .window-large {
            position: absolute;
            width: 15px;
            height: 20px;
            background: #2c3e50;
            border-radius: 2px;
            transition: background 0.3s;
        }

        .window-large.lit {
            background: #f1c40f;
            box-shadow: 0 0 20px #f1c40f, 0 0 40px rgba(241, 196, 15, 0.5);
        }

        /* Generate window grid for each building */
        .building-large:nth-child(1) .window-large { margin: 8px; }
        .building-large:nth-child(2) .window-large { margin: 10px; }
        .building-large:nth-child(3) .window-large { margin: 7px; }
        .building-large:nth-child(4) .window-large { margin: 12px; }
        .building-large:nth-child(5) .window-large { margin: 9px; }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Paper Bird */
        #bird {
            position: absolute;
            width: 60px;
            height: 60px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            transition: all 0.3s ease;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.2));
            z-index: 600;
        }

        #bird.flying {
            animation: flutter 0.5s ease-in-out infinite;
        }

        #bird.grabbed {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.1);
        }

        @keyframes flutter {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(-5deg); }
            75% { transform: translate(-50%, -50%) rotate(5deg); }
        }

        /* Mountain Destination */
        #mountain {
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 300px;
            height: 400px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #mountain:hover {
            transform: scale(1.05);
        }

        .mountain-peak {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 300px solid #8B7355;
        }

        .mountain-snow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 80px solid transparent;
            border-right: 80px solid transparent;
            border-bottom: 100px solid #FFFFFF;
        }

        .mountain-label {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: #2c3e50;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Ocean Destination */
        #ocean {
            position: absolute;
            bottom: 0;
            right: 10%;
            width: 300px;
            height: 200px;
            cursor: pointer;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            bottom: 0;
            width: 400px;
            height: 100px;
            background: #4A90E2;
            border-radius: 50%;
            animation: wave-motion 3s ease-in-out infinite;
        }

        .wave:nth-child(1) {
            animation-delay: 0s;
            opacity: 0.7;
        }

        .wave:nth-child(2) {
            animation-delay: 1s;
            opacity: 0.5;
        }

        @keyframes wave-motion {
            0%, 100% { transform: translateX(-100px) translateY(0); }
            50% { transform: translateX(0) translateY(-10px); }
        }

        .ocean-label {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: #2c3e50;
            font-weight: bold;
            white-space: nowrap;
        }

        /* City Destination */
        #city {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 300px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #city:hover {
            transform: translateX(-50%) scale(1.05);
        }

        .building {
            position: absolute;
            bottom: 0;
            background: #34495e;
            border-radius: 2px 2px 0 0;
        }

        .building:nth-child(1) {
            left: 20px;
            width: 60px;
            height: 200px;
        }

        .building:nth-child(2) {
            left: 100px;
            width: 80px;
            height: 250px;
        }

        .building:nth-child(3) {
            left: 200px;
            width: 70px;
            height: 180px;
        }

        .building:nth-child(4) {
            left: 290px;
            width: 90px;
            height: 220px;
        }

        .window {
            position: absolute;
            width: 8px;
            height: 12px;
            background: #2c3e50;
            border-radius: 1px;
            transition: background 0.3s;
        }

        .window.lit {
            background: #f1c40f;
            box-shadow: 0 0 10px #f1c40f;
        }

        .city-label {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: #2c3e50;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Outcome Modal */
        #outcome {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
        }

        #outcome.show {
            display: flex;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .outcome-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .outcome-content h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .outcome-content p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 2rem;
        }

        #restartButton {
            padding: 12px 30px;
            font-size: 1.1rem;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #restartButton:hover {
            background: #2980b9;
            transform: scale(1.05);
        }

        /* Instructions */
        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1rem;
            color: #2c3e50;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 50;
            max-width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Intro Screen -->
        <div id="intro">
            <h1>🕊️ The Paper Bird's Journey</h1>
            <p>
                A folded paper bird awaits its destiny. Three paths lie before it,
                each representing a different journey through life. Where will you guide it?
            </p>
            <button id="startButton">Begin Journey</button>
        </div>

        <!-- Instructions -->
        <div id="instructions">
            Choose the bird's path: Click the ⛰ mountain, drag toward the 🌊 ocean, or click the 🌆 city
        </div>

        <!-- Paper Bird -->
        <div id="bird">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Bird body -->
                <polygon points="50,20 30,50 50,45 70,50" fill="#F5F5DC" stroke="#D3D3D3" stroke-width="1"/>
                <!-- Bird wings -->
                <polygon points="50,45 20,40 30,50" fill="#FAFAF0" stroke="#D3D3D3" stroke-width="1"/>
                <polygon points="50,45 80,40 70,50" fill="#FAFAF0" stroke="#D3D3D3" stroke-width="1"/>
                <!-- Bird tail -->
                <polygon points="50,45 45,70 50,60 55,70" fill="#F5F5DC" stroke="#D3D3D3" stroke-width="1"/>
            </svg>
        </div>

        <!-- Mountain Destination -->
        <div id="mountain">
            <div class="mountain-peak">
                <div class="mountain-snow"></div>
            </div>
            <div class="mountain-label">⛰ Freedom</div>
        </div>

        <!-- Ocean Destination -->
        <div id="ocean">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="ocean-label">🌊 Peace</div>
        </div>

        <!-- City Destination -->
        <div id="city">
            <div class="building">
                <div class="window" style="top: 20px; left: 10px;"></div>
                <div class="window" style="top: 20px; left: 25px;"></div>
                <div class="window" style="top: 40px; left: 10px;"></div>
                <div class="window" style="top: 40px; left: 25px;"></div>
                <div class="window" style="top: 60px; left: 10px;"></div>
                <div class="window" style="top: 60px; left: 25px;"></div>
            </div>
            <div class="building">
                <div class="window" style="top: 20px; left: 15px;"></div>
                <div class="window" style="top: 20px; left: 35px;"></div>
                <div class="window" style="top: 40px; left: 15px;"></div>
                <div class="window" style="top: 40px; left: 35px;"></div>
                <div class="window" style="top: 60px; left: 15px;"></div>
                <div class="window" style="top: 60px; left: 35px;"></div>
                <div class="window" style="top: 80px; left: 15px;"></div>
                <div class="window" style="top: 80px; left: 35px;"></div>
            </div>
            <div class="building">
                <div class="window" style="top: 20px; left: 12px;"></div>
                <div class="window" style="top: 20px; left: 28px;"></div>
                <div class="window" style="top: 40px; left: 12px;"></div>
                <div class="window" style="top: 40px; left: 28px;"></div>
                <div class="window" style="top: 60px; left: 12px;"></div>
                <div class="window" style="top: 60px; left: 28px;"></div>
            </div>
            <div class="building">
                <div class="window" style="top: 20px; left: 15px;"></div>
                <div class="window" style="top: 20px; left: 35px;"></div>
                <div class="window" style="top: 40px; left: 15px;"></div>
                <div class="window" style="top: 40px; left: 35px;"></div>
                <div class="window" style="top: 60px; left: 15px;"></div>
                <div class="window" style="top: 60px; left: 35px;"></div>
                <div class="window" style="top: 80px; left: 15px;"></div>
                <div class="window" style="top: 80px; left: 35px;"></div>
            </div>
            <div class="city-label">🌆 Connection</div>
        </div>

        <!-- Mountain Episode Screen -->
        <div id="mountainEpisode" class="episode-screen">
            <div class="sun-rays"></div>
            <div class="mountain-scene">
                <div class="mountain-large">
                    <div class="mountain-snow-large"></div>
                </div>
                <div class="mountain-large">
                    <div class="mountain-snow-large"></div>
                </div>
                <div class="mountain-large">
                    <div class="mountain-snow-large"></div>
                </div>
            </div>
        </div>

        <!-- Ocean Episode Screen -->
        <div id="oceanEpisode" class="episode-screen">
            <div class="clouds">
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>
            </div>
            <div class="ocean-scene">
                <div class="wave-large"></div>
                <div class="wave-large"></div>
                <div class="wave-large"></div>
            </div>
        </div>

        <!-- City Episode Screen -->
        <div id="cityEpisode" class="episode-screen">
            <div class="stars" id="starField"></div>
            <div class="city-scene" id="citySceneLarge">
                <!-- Buildings will be generated dynamically with windows -->
            </div>
        </div>

        <!-- Outcome Modal -->
        <div id="outcome">
            <div class="outcome-content">
                <h2 id="outcomeTitle"></h2>
                <p id="outcomeText"></p>
                <button id="restartButton">Journey Again</button>
            </div>
        </div>
    </div>

    <script>
        // Game state
        let isDragging = false;
        let hasChosen = false;

        // Elements
        const intro = document.getElementById('intro');
        const startButton = document.getElementById('startButton');
        const bird = document.getElementById('bird');
        const mountain = document.getElementById('mountain');
        const ocean = document.getElementById('ocean');
        const city = document.getElementById('city');
        const outcome = document.getElementById('outcome');
        const outcomeTitle = document.getElementById('outcomeTitle');
        const outcomeText = document.getElementById('outcomeText');
        const restartButton = document.getElementById('restartButton');
        const instructions = document.getElementById('instructions');

        const mountainEpisode = document.getElementById('mountainEpisode');
        const oceanEpisode = document.getElementById('oceanEpisode');
        const cityEpisode = document.getElementById('cityEpisode');

        // Initialize city scene
        initializeCityScene();
        initializeStars();

        // Start the journey
        startButton.addEventListener('click', () => {
            intro.classList.add('hidden');
            setTimeout(() => {
                intro.style.display = 'none';
                bird.classList.add('flying');
            }, 800);
        });

        // Mountain path - Click to fly upward
        mountain.addEventListener('click', () => {
            if (hasChosen) return;
            hasChosen = true;
            instructions.style.display = 'none';

            // Show mountain episode
            mountainEpisode.classList.add('active');

            // Bird flies around in the mountain scene
            bird.classList.add('flying');
            animateBirdInMountain();
        });

        function animateBirdInMountain() {
            // Bird starts from left side
            bird.style.transition = 'all 0.5s ease-out';
            bird.style.left = '10%';
            bird.style.top = '60%';
            bird.style.opacity = '1';

            setTimeout(() => {
                // Bird flies right and up
                bird.style.transition = 'all 3s ease-in-out';
                bird.style.left = '40%';
                bird.style.top = '45%';
            }, 500);

            setTimeout(() => {
                // Continue flying right and higher
                bird.style.transition = 'all 3s ease-in-out';
                bird.style.left = '70%';
                bird.style.top = '30%';
            }, 2500);

            setTimeout(() => {
                // Bird flies to upper right and disappears
                bird.style.transition = 'all 2.5s ease-out';
                bird.style.left = '90%';
                bird.style.top = '15%';
                bird.style.opacity = '0';
                bird.style.transform = 'translate(-50%, -50%) scale(0.3)';

                setTimeout(() => {
                    showOutcome(
                        'Freedom ⛰',
                        'The paper bird soars higher and higher, disappearing into the warm sunlight. It has chosen the path of freedom, unbounded by earthly concerns, forever seeking new horizons above the clouds.'
                    );
                }, 2000);
            }, 4500);
        }

        // Ocean path - Drag toward ocean
        let dragStartX, dragStartY;

        bird.addEventListener('mousedown', startDrag);
        bird.addEventListener('touchstart', startDrag);

        function startDrag(e) {
            if (hasChosen) return;
            isDragging = true;
            bird.classList.add('grabbed');
            bird.classList.remove('flying');

            const pos = getEventPosition(e);
            dragStartX = pos.x;
            dragStartY = pos.y;
        }

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag);

        function drag(e) {
            if (!isDragging) return;

            const pos = getEventPosition(e);
            bird.style.left = pos.x + 'px';
            bird.style.top = pos.y + 'px';
            bird.style.transition = 'none';
        }

        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            bird.classList.remove('grabbed');

            const pos = getEventPosition(e);
            const oceanRect = ocean.getBoundingClientRect();

            // Check if dropped near ocean
            if (pos.x > oceanRect.left - 100 &&
                pos.x < oceanRect.right + 100 &&
                pos.y > oceanRect.top - 100) {

                if (hasChosen) return;
                hasChosen = true;
                instructions.style.display = 'none';

                // Show ocean episode
                oceanEpisode.classList.add('active');

                // Bird glides in ocean scene
                bird.classList.add('flying');
                animateBirdInOcean();
            } else {
                // Return to center if not dropped on ocean
                bird.classList.add('flying');
                bird.style.transition = 'all 0.5s ease-out';
                bird.style.left = '50%';
                bird.style.top = '50%';
            }
        }

        function animateBirdInOcean() {
            // Bird starts from left, flies right
            bird.style.transition = 'all 0.5s ease-out';
            bird.style.left = '10%';
            bird.style.top = '35%';
            bird.style.opacity = '1';

            setTimeout(() => {
                // Bird glides to the right
                bird.style.transition = 'all 3.5s ease-in-out';
                bird.style.left = '45%';
                bird.style.top = '40%';
            }, 500);

            setTimeout(() => {
                // Continue gliding right
                bird.style.transition = 'all 3.5s ease-in-out';
                bird.style.left = '80%';
                bird.style.top = '45%';
            }, 3000);

            setTimeout(() => {
                // Bird descends toward water while moving right
                bird.style.transition = 'all 2.5s ease-out';
                bird.style.left = '95%';
                bird.style.top = '65%';
                bird.style.transform = 'translate(-50%, -50%) rotate(0deg) scale(0.9)';
            }, 5500);

            setTimeout(() => {
                // Bird lands on water
                bird.classList.remove('flying');

                setTimeout(() => {
                    showOutcome(
                        'Peace 🌊',
                        'The paper bird glides gracefully over the waves before gently landing on the calm water. It floats peacefully, embracing tranquility and the soothing rhythm of the tides. Here, it finds serenity.'
                    );
                }, 1000);
            }, 7500);
        }

        // City path - Click to fly to city
        city.addEventListener('click', () => {
            if (hasChosen) return;
            hasChosen = true;
            instructions.style.display = 'none';

            // Show city episode
            cityEpisode.classList.add('active');

            // Bird flies around city
            bird.classList.add('flying');
            animateBirdInCity();
        });

        function animateBirdInCity() {
            // Bird enters from left
            bird.style.transition = 'all 0.5s ease-out';
            bird.style.left = '10%';
            bird.style.top = '35%';
            bird.style.opacity = '1';

            // Light up windows gradually
            setTimeout(() => {
                lightUpCityWindows();
            }, 500);

            setTimeout(() => {
                // Bird flies through city left to right
                bird.style.transition = 'all 3s ease-in-out';
                bird.style.left = '35%';
                bird.style.top = '42%';
            }, 1000);

            setTimeout(() => {
                // Continue flying right, weaving up
                bird.style.transition = 'all 3s ease-in-out';
                bird.style.left = '60%';
                bird.style.top = '38%';
            }, 3500);

            setTimeout(() => {
                // Flying toward right side
                bird.style.transition = 'all 2.5s ease-in-out';
                bird.style.left = '85%';
                bird.style.top = '45%';
            }, 6000);

            setTimeout(() => {
                // Bird lands on building window at right
                bird.style.transition = 'all 1.5s ease-out';
                bird.style.left = '90%';
                bird.style.transform = 'translate(-50%, -50%) rotateX(90deg) scale(0.7)';
                bird.classList.remove('flying');

                setTimeout(() => {
                    showOutcome(
                        'Connection 🌆',
                        'The paper bird folds itself into a letter and lands gently on a window sill. Inside, a human finds it and reads the message within. The bird has chosen connection, becoming a bridge between hearts and minds.'
                    );
                }, 1500);
            }, 8000);
        }

        function lightUpCityWindows() {
            const buildings = document.querySelectorAll('#citySceneLarge .building-large');
            let delay = 0;

            buildings.forEach(building => {
                const windows = building.querySelectorAll('.window-large');
                windows.forEach(window => {
                    setTimeout(() => {
                        window.classList.add('lit');
                    }, delay);
                    delay += 50;
                });
            });
        }

        // Helper functions
        function getEventPosition(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function showOutcome(title, text) {
            setTimeout(() => {
                outcomeTitle.textContent = title;
                outcomeText.textContent = text;
                outcome.classList.add('show');
            }, 500);
        }

        function initializeCityScene() {
            const cityScene = document.getElementById('citySceneLarge');
            const buildingHeights = [350, 450, 300, 500, 380, 420, 320, 480, 360, 440, 310, 490, 370, 430, 340];
            const buildingWidths = [120, 150, 100, 180, 130, 140, 110, 170, 125, 160, 105, 175, 135, 155, 115];

            // Create 3 sets of buildings for seamless scrolling
            buildingHeights.forEach((height, index) => {
                const building = document.createElement('div');
                building.className = 'building-large';
                building.style.height = height + 'px';
                building.style.width = buildingWidths[index] + 'px';

                // Create windows
                const cols = Math.floor(buildingWidths[index] / 25);
                const rows = Math.floor(height / 30);

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const window = document.createElement('div');
                        window.className = 'window-large';
                        window.style.top = (row * 30 + 10) + 'px';
                        window.style.left = (col * 25 + 10) + 'px';
                        building.appendChild(window);
                    }
                }

                cityScene.appendChild(building);
            });
        }

        function initializeStars() {
            const starField = document.getElementById('starField');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 60 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starField.appendChild(star);
            }
        }

        // Restart button
        restartButton.addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
