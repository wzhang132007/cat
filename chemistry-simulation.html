<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Chemistry Simulation</title>
    <link rel="stylesheet" href="chemistry-simulation.css">
</head>
<body>
    <div class="lab-container">
        <h1 class="title">Chemistry Simulation Lab</h1>

        <div class="instruction">Step 1: Select a solution and click a beaker to fill it | Step 2: Select two filled beakers to mix</div>

        <!-- Solution Selection Panel -->
        <div class="solution-panel">
            <div class="solution-title">Available Solutions:</div>
            <div class="solution-options">
                <div class="solution-option" data-solution="acid">
                    <div class="solution-preview acid"></div>
                    <div class="solution-name">Acid</div>
                </div>
                <div class="solution-option" data-solution="base">
                    <div class="solution-preview base"></div>
                    <div class="solution-name">Base</div>
                </div>
                <div class="solution-option" data-solution="salt">
                    <div class="solution-preview salt"></div>
                    <div class="solution-name">Salt</div>
                </div>
                <div class="solution-option" data-solution="water">
                    <div class="solution-preview water"></div>
                    <div class="solution-name">Water</div>
                </div>
                <div class="solution-option" data-solution="organic">
                    <div class="solution-preview organic"></div>
                    <div class="solution-name">Organic</div>
                </div>
                <div class="solution-option" data-solution="indicator">
                    <div class="solution-preview indicator"></div>
                    <div class="solution-name">Indicator</div>
                </div>
            </div>
        </div>

        <div class="lab-table">
            <div class="beaker-container" data-beaker="A">
                <div class="beaker" id="beaker-A">
                    <div class="beaker-glass">
                        <div class="liquid"></div>
                        <div class="reflection"></div>
                    </div>
                    <div class="beaker-base"></div>
                </div>
                <div class="label">Beaker A</div>
                <div class="selection-indicator"></div>
                <div class="fill-indicator">Empty</div>
            </div>

            <div class="beaker-container" data-beaker="B">
                <div class="beaker" id="beaker-B">
                    <div class="beaker-glass">
                        <div class="liquid"></div>
                        <div class="reflection"></div>
                    </div>
                    <div class="beaker-base"></div>
                </div>
                <div class="label">Beaker B</div>
                <div class="selection-indicator"></div>
                <div class="fill-indicator">Empty</div>
            </div>

            <div class="beaker-container" data-beaker="C">
                <div class="beaker" id="beaker-C">
                    <div class="beaker-glass">
                        <div class="liquid"></div>
                        <div class="reflection"></div>
                    </div>
                    <div class="beaker-base"></div>
                </div>
                <div class="label">Beaker C</div>
                <div class="selection-indicator"></div>
                <div class="fill-indicator">Empty</div>
            </div>

            <div class="beaker-container" data-beaker="D">
                <div class="beaker" id="beaker-D">
                    <div class="beaker-glass">
                        <div class="liquid"></div>
                        <div class="reflection"></div>
                    </div>
                    <div class="beaker-base"></div>
                </div>
                <div class="label">Beaker D</div>
                <div class="selection-indicator"></div>
                <div class="fill-indicator">Empty</div>
            </div>

            <div class="beaker-container" data-beaker="E">
                <div class="beaker" id="beaker-E">
                    <div class="beaker-glass">
                        <div class="liquid"></div>
                        <div class="reflection"></div>
                    </div>
                    <div class="beaker-base"></div>
                </div>
                <div class="label">Beaker E</div>
                <div class="selection-indicator"></div>
                <div class="fill-indicator">Empty</div>
            </div>

            <div class="beaker-container" data-beaker="F">
                <div class="beaker" id="beaker-F">
                    <div class="beaker-glass">
                        <div class="liquid"></div>
                        <div class="reflection"></div>
                    </div>
                    <div class="beaker-base"></div>
                </div>
                <div class="label">Beaker F</div>
                <div class="selection-indicator"></div>
                <div class="fill-indicator">Empty</div>
            </div>
        </div>

        <div class="controls">
            <button id="mix-btn" class="btn btn-mix" disabled>Mix Selected Beakers</button>
            <button id="reset-btn" class="btn btn-reset">Reset</button>
        </div>

        <div class="result-message" id="result-message"></div>

        <!-- Particle container for energy burst effect -->
        <div class="particle-container" id="particle-container"></div>
    </div>

    <script src="chemistry-simulation.js"></script>
</body>
</html>
